name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write # OIDC
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check lambda/ tests/
      - run: ruff format --check lambda/ tests/

  test:
    name: Tests + coverage
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt -r lambda/requirements.txt
      - run: pytest tests/ --cov=lambda --cov-report=term-missing --cov-fail-under=85
        env:
          AWS_REGION: eu-west-1

  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.x"
      - run: terraform fmt -check -recursive terraform/
      - working-directory: terraform
        run: |
          terraform init -backend=false
          terraform validate

  security:
    name: Checkov (IaC)
    runs-on: ubuntu-latest
    needs: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          quiet: true
          soft_fail: true # reports findings, does not block

  build:
    name: Build function.zip
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          cd lambda
          pip install -r requirements.txt -t package/
          cp guardrail.py package/
          cd package && zip -qr ../function.zip . -x "*.pyc" -x "*/__pycache__/*"
          echo "function.zip: $(du -sh ../function.zip | cut -f1)"
      - uses: actions/upload-artifact@v4
        with:
          name: lambda-zip
          path: lambda/function.zip
          retention-days: 1

  deploy:
    # Ships new Lambda code only. Infrastructure changes are applied by an operator
    # with `terraform apply`; the OIDC role has no permission to do that.
    name: Deploy Lambda code (main only)
    runs-on: ubuntu-latest
    needs: [build, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lambda-zip
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1
      - run: |
          aws lambda update-function-code \
            --function-name ml-cost-optimizer-guardrail \
            --zip-file fileb://function.zip \
            --publish
